<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kenyenya District Hospital - Child Vaccination System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; }
    .hero {
      background: linear-gradient(135deg, #1a2a3a 0%, #2c3e50 100%);
      color: white;
      padding: 50px 0 40px;
      text-align: center;
    }
    .hero h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; }
    .hero p { font-size: 1rem; opacity: 0.85; max-width: 500px; margin: 0 auto; }
    .hero-badge {
      display: inline-block;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-bottom: 15px;
    }
    .portal-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s;
    }
    .portal-btn:hover { transform: translateY(-2px); color: white; }
    .portal-btn-staff { background: #1a2a3a; color: white; }
    .portal-btn-staff:hover { background: #2c3e50; }
    .portal-btn-parent { background: #2e7d32; color: white; }
    .portal-btn-parent:hover { background: #1b5e20; }
    .quick-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      text-decoration: none;
      color: #495057;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .quick-link:hover { background: #e9ecef; color: #212529; }
    .stats-bar {
      background: white;
      padding: 15px 0;
    }
    .stat-item { text-align: center; }
    .stat-item .number { font-size: 1.5rem; font-weight: 800; color: #1a2a3a; }
    .stat-item .label { font-size: 0.75rem; color: #6c757d; text-transform: uppercase; letter-spacing: 0.5px; }
    footer {
      background: #1a2a3a;
      color: rgba(255,255,255,0.7);
      padding: 20px 0;
      text-align: center;
      font-size: 0.85rem;
    }
    footer strong { color: white; }
  </style>
</head>
<body>

  <section class="hero">
    <div class="container">
      <div class="hero-badge">🏥 Kenyenya District Hospital</div>
      <h1>Child Vaccination System</h1>
      <p>Digitizing immunization records & tracking vaccination schedules for every child.</p>
      <div class="d-flex justify-content-center gap-3 mt-4 flex-wrap">
        <a href="pages/login.html" class="portal-btn portal-btn-staff">
          <span style="font-size:1.5rem;">👨‍⚕️</span> Staff Login
        </a>
        <a href="pages/parent-login.html" class="portal-btn portal-btn-parent">
          <span style="font-size:1.5rem;">👨‍👩‍👧‍👦</span> Parent Portal
        </a>
      </div>
    </div>
  </section>

  <section class="stats-bar">
    <div class="container">
      <div class="row" id="statsRow">
        <div class="col-3 col-md-3 stat-item"><div class="number" id="statChildren">—</div><div class="label">Children</div></div>
        <div class="col-3 col-md-3 stat-item"><div class="number" id="statVaccinations">—</div><div class="label">Vaccinations</div></div>
        <div class="col-3 col-md-3 stat-item"><div class="number" id="statAppointments">—</div><div class="label">Appointments</div></div>
        <div class="col-3 col-md-3 stat-item"><div class="number" id="statVaccines">—</div><div class="label">Vaccines</div></div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p class="mb-0"><strong>Kenyenya District Hospital</strong> — Child Vaccination System © 2026</p>
    </div>
  </footer>

  <script>
    async function loadStats() {
      try {
        const resp = await fetch('https://immunizationsys.onrender.com/api/reports');
        const result = await resp.json();
        if (result.success && result.data) {
          document.getElementById('statChildren').textContent = result.data.totalChildren || 0;
          document.getElementById('statVaccinations').textContent = result.data.totalVaccinations || 0;
          document.getElementById('statAppointments').textContent = result.data.upcomingAppointments || 0;
          document.getElementById('statVaccines').textContent = result.data.inventoryBreakdown ? Object.keys(result.data.inventoryBreakdown).length : '—';
        }
      } catch (e) {}
    }
    loadStats();
  </script>
</body>
</html>
