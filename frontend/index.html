<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kenyenya District Hospital - Child Vaccination System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .hero {
      background: linear-gradient(135deg, #1a2a3a 0%, #2c3e50 100%);
      color: white;
      padding: 60px 0 50px;
      text-align: center;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; }
    .hero p { font-size: 1.05rem; opacity: 0.85; max-width: 520px; margin: 0 auto 30px; }
    .hero-badge {
      display: inline-block;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 5px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      letter-spacing: 0.5px;
    }
    .portal-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1.05rem;
      text-decoration: none;
      transition: all 0.3s;
    }
    .portal-btn:hover { transform: translateY(-2px); color: white; box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
    .portal-btn-staff { background: #ffffff; color: #1a2a3a; }
    .portal-btn-staff:hover { background: #e9ecef; color: #1a2a3a; }
    .portal-btn-parent { background: #2e7d32; color: white; }
    .portal-btn-parent:hover { background: #1b5e20; }
    footer {
      background: #1a2a3a;
      color: rgba(255,255,255,0.7);
      padding: 18px 0;
      text-align: center;
      font-size: 0.85rem;
      margin-top: auto;
    }
    footer strong { color: white; }
  </style>
</head>
<body>

  <section class="hero">
    <div class="container">
      <div class="hero-badge">🏥 Kenyenya District Hospital</div>
      <h1>Child Vaccination System</h1>
      <p>Digitizing immunization records & tracking vaccination schedules for every child in our community.</p>
      <div class="d-flex justify-content-center gap-3 flex-wrap">
        <a href="pages/login.html" class="portal-btn portal-btn-staff">
          <span style="font-size:1.4rem;">👨‍⚕️</span> Staff Login
        </a>
        <a href="pages/parent-login.html" class="portal-btn portal-btn-parent">
          <span style="font-size:1.4rem;">👨‍👩‍👧‍👦</span> Parent Portal
        </a>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p class="mb-0"><strong>Kenyenya District Hospital</strong> — Child Vaccination System © 2026 | Secure Healthcare System</p>
    </div>
  </footer>

</body>
</html>
